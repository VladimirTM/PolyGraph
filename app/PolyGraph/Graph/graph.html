<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Graf</title>
<style>
  :root { color-scheme: light dark; }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden;
               -webkit-user-select: none; -webkit-touch-callout: none; }
  #cy { position: absolute; inset: 0; }
</style>
<script src="cytoscape.min.js"></script>
</head>
<body>
<div id="cy"></div>
<script>
// Graful din aplicație până la B6. Primește JSON-ul Cytoscape (contracts/schema/graph.schema.json)
// prin window.pgRender(...) și trimite înapoi atingerile: messageHandlers.alert (id-ul alertei de
// pe muchie) și messageHandlers.med (id-ul medicamentului). Pagina lui B6 cu ?embed=1 trimite la fel.
(function () {
  const dark = window.matchMedia('(prefers-color-scheme: dark)');
  let cy = null;
  let lastElements = null;

  function palette() {
    const d = dark.matches;
    return {
      text: d ? '#F2F2F7' : '#1C1C1E',
      muted: d ? '#8E8E93' : '#8E8E93',
      faint: d ? 'rgba(235,235,245,0.18)' : 'rgba(60,60,67,0.18)',
      node: d ? '#2C2C2E' : '#FFFFFF',
      nodeBorder: d ? '#48484A' : '#D1D1D6',
      accent: d ? '#5CC2BC' : '#0E6B68',
      red: d ? '#FF453A' : '#FF3B30',
      orange: d ? '#FF9F0A' : '#FF9500',
      gray: d ? '#636366' : '#AEAEB2',
      purple: d ? '#BF5AF2' : '#AF52DE',
      green: d ? '#30D158' : '#34C759',
    };
  }

  function severityColor(p, s) {
    switch (s) {
      case 'critical': case 'major': return p.red;
      case 'moderate': return p.orange;
      case 'minor': return p.gray;
      default: return p.gray;
    }
  }

  function style(p) {
    return [
      { selector: 'node', style: {
          'label': 'data(label)', 'color': p.text, 'font-family': '-apple-system, system-ui',
          'font-size': 11, 'text-valign': 'bottom', 'text-margin-y': 4,
          'text-wrap': 'wrap', 'text-max-width': 90,
          'background-color': p.node, 'border-width': 1.5, 'border-color': p.nodeBorder,
          'width': 18, 'height': 18 } },
      { selector: 'node[type = "patient"]', style: {
          'background-color': p.accent, 'border-width': 0, 'width': 34, 'height': 34,
          'font-size': 13, 'font-weight': 600 } },
      { selector: 'node[type = "product"]', style: {
          'shape': 'round-rectangle', 'width': 26, 'height': 26, 'font-size': 12, 'font-weight': 600,
          'border-color': p.accent, 'border-width': 2 } },
      { selector: 'node[type = "product"][severity = "critical"], node[type = "product"][severity = "major"]',
        style: { 'border-color': p.red } },
      { selector: 'node[type = "product"][severity = "moderate"]', style: { 'border-color': p.orange } },
      { selector: 'node[type = "substance"]', style: { 'width': 12, 'height': 12, 'font-size': 10, 'color': p.muted } },
      { selector: 'node[type = "atc_class"]', style: {
          'shape': 'diamond', 'width': 10, 'height': 10, 'font-size': 9, 'color': p.muted } },
      { selector: 'node[type = "food"]', style: {
          'shape': 'round-tag', 'width': 14, 'height': 14, 'border-color': p.green, 'font-size': 10 } },
      { selector: 'node[type = "symptom"]', style: {
          'shape': 'star', 'width': 16, 'height': 16, 'border-color': p.purple, 'font-size': 10 } },

      { selector: 'edge', style: {
          'width': 1, 'line-color': p.faint, 'curve-style': 'bezier', 'target-arrow-shape': 'none' } },
      { selector: 'edge[type = "in_class"]', style: { 'line-style': 'dotted' } },
      { selector: 'edge[type = "interacts"], edge[type = "food_interaction"]', style: {
          'width': 2.5, 'line-color': (e) => severityColor(p, e.data('severity')), 'z-index': 10 } },
      { selector: 'edge[type = "interacts"][severity = "critical"], edge[type = "interacts"][severity = "major"]',
        style: { 'width': 4 } },
      { selector: 'edge[type = "food_interaction"]', style: { 'line-style': 'dashed' } },
      { selector: 'edge[severity = "unknown"]', style: { 'line-style': 'dashed', 'width': 1, 'line-color': p.gray } },
      { selector: 'edge[type = "possibly_related"], edge[type = "reported"]', style: {
          'line-style': 'dashed', 'line-color': p.purple, 'width': 1.5 } },
      { selector: 'edge[alert_id]', style: { 'overlay-padding': 10 } },
      { selector: ':selected', style: { 'overlay-opacity': 0.12, 'overlay-color': p.accent } },
    ];
  }

  // inel interior: pacientul; apoi medicamentele; apoi substanțele; la margine clasele, alimentele, simptomele
  const level = { patient: 4, product: 3, substance: 2 };

  function post(name, value) {
    const handler = window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers[name];
    if (handler) handler.postMessage(value);
  }

  function render(elements) {
    lastElements = elements;
    if (cy) cy.destroy();
    cy = cytoscape({
      container: document.getElementById('cy'),
      elements: elements,
      style: style(palette()),
      layout: {
        name: 'concentric', animate: false, padding: 24, minNodeSpacing: 22,
        concentric: (n) => level[n.data('type')] || 1, levelWidth: () => 1,
      },
      minZoom: 0.3, maxZoom: 3,
      boxSelectionEnabled: false, autoungrabify: true,
    });
    cy.on('tap', 'edge', (event) => {
      const id = event.target.data('alert_id');
      if (id) post('alert', id);
    });
    cy.on('tap', 'node[type = "product"]', (event) => post('med', event.target.id()));
    post('ready', elements.nodes.length);
  }

  dark.addEventListener('change', () => { if (cy) cy.style(style(palette())); });
  window.addEventListener('resize', () => { if (cy) { cy.resize(); cy.fit(undefined, 24); } });
  window.pgRender = (elements) => render(elements);
})();
</script>
</body>
</html>
