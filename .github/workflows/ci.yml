name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    # Contractele și Python; iOS rulează local (make check-ios), pe Mac
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv python install 3.12
      - run: uv sync --project backend
      - run: make check
