[project]
name = "polygraph-backend"
version = "0.1.0"
description = "PolyGraph: backend FastAPI, motorul de interacțiuni și serverul mock"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
    "jsonschema>=4.23",
    "referencing>=0.35",
    "openapi-spec-validator>=0.7",
    "openpyxl>=3.1.5",
    "rapidfuzz>=3.14.6",
    "pydantic>=2.14.3",
    "zxing-cpp>=3,<4",
    "pillow>=11",
    "python-dotenv>=1",
    "jinja2>=3.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 130
target-version = "py312"
extend-exclude = ["../kb/raw"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
